name: Auto Update IPTV Tokens

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পরপর নিজে থেকেই রান হবে
  workflow_dispatch: # হাত দিয়ে ম্যানুয়ালি রান করার অপশনও থাকবে

jobs:
  update-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python generate_local.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add playlist.m3u
          git commit -m "Auto-update streaming tokens via GitHub Actions" || echo "No changes to commit"
          git push